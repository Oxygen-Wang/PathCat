name: CI

on:
  push:
    branches: ['main', 'codex/**', 'fix/**', 'feat/**', 'release/**']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: windows-tests
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify version consistency
        run: python tools/check_version.py
      - name: Test desktop and file operations
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile Python source
        run: python -m compileall -q quietpet PathCat.py QuietPet.py tools
