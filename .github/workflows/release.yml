name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify tag, version and main ancestry
        shell: pwsh
        run: |
          python tools/check_version.py --tag "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to a commit on main' }
      - name: Test before packaging
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Install pinned build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build Windows release
        run: python tools/build_windows.py
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          python tools/release_notes.py --out dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseArgs = @('release', 'create', "$env:GITHUB_REF_NAME", "dist/PathCat-$version-windows-x64.zip", 'dist/SHA256SUMS.txt', '--verify-tag', '--title', "PathCat $version", '--notes-file', 'dist/release-notes.md')
          if ($version.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
